name: unified_local_data
description: Engine-agnostic local storage for Flutter. One API over Hive, Isar or your own engine, with typed objects, queries, reactive streams and transactions.
version: 2.0.0
repository: https://github.com/mrYasinHamidi/unified_local_data/tree/main/packages/unified_local_data
issue_tracker: https://github.com/mrYasinHamidi/unified_local_data/issues
topics:
  - database
  - storage
  - hive
  - offline
  - persistence

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  hive_ce: ^2.21.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  path_provider: ^2.1.6
  web: ^1.1.1
